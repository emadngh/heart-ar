<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>Animated Heart AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Plays animations contained inside glTF models -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- MindAR image tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    a-scene,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      width: min(84%, 420px);
      padding: 11px 15px;

      color: white;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">Loading animated heart…</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="120000">

      <a-asset-item
        id="heartAsset"
        src="./heart.gltf"
      ></a-asset-item>

    </a-assets>

    <!-- AR camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Lighting -->
    <a-entity
      light="
        type: ambient;
        intensity: 1.8;
      "
    ></a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 1.8;
      "
      position="1 2 3"
    ></a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 1.2;
      "
      position="-2 1 2"
    ></a-entity>

    <!-- Everything inside this entity attaches to the image target -->
    <a-entity
      id="heartTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-gltf-model
        id="heartModel"
        src="#heartAsset"

        position="0 0 0.25"
        rotation="0 0 0"
        scale="100 100 100"

        animation-mixer="
          clip: Scene;
          loop: repeat;
          repetitions: Infinity;
          timeScale: 1;
          clampWhenFinished: false;
        "
      ></a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const status = document.getElementById("status");
      const scene = document.querySelector("a-scene");
      const target = document.getElementById("heartTarget");
      const model = document.getElementById("heartModel");

      scene.addEventListener("arReady", () => {
        status.textContent =
          "Camera ready. Point it at the complete target image.";
      });

      scene.addEventListener("arError", () => {
        status.textContent =
          "AR could not start. Check camera permission and HTTPS.";
      });

      model.addEventListener("model-loaded", () => {
        status.textContent =
          "Heart loaded. Point the camera at the target.";

        const mesh = model.getObject3D("mesh");

        if (mesh) {
          console.log("Heart model loaded successfully.");

          console.log(
            "Animation clips:",
            mesh.animations
              ? mesh.animations.map(animation => animation.name)
              : "No animations found"
          );
        }
      });

      model.addEventListener("model-error", event => {
        console.error("Model loading error:", event.detail);

        status.textContent =
          "Model failed to load. Check the GLTF, BIN, and images folder.";
      });

      target.addEventListener("targetFound", () => {
        status.textContent =
          "Target detected — animated heart displayed.";
      });

      target.addEventListener("targetLost", () => {
        status.textContent =
          "Target lost. Point the camera at the complete image.";
      });
    });
  </script>

</body>
</html>
