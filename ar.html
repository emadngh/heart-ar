<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>Animated Heart AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Plays the animation stored inside the GLTF -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    /*
      Your Sketchfab model contains a large internal offset.
      This component removes that offset after the model loads.
    */
    AFRAME.registerComponent("fix-heart-model", {
      init: function () {
        this.el.addEventListener("model-loaded", () => {
          const loadedScene = this.el.getObject3D("mesh");

          if (!loadedScene) {
            console.error("The loaded GLTF scene was not found.");
            return;
          }

          /*
            Find the top-level node from your actual GLTF file.
            If the name is unavailable, use the first child.
          */
          const sketchfabRoot =
            loadedScene.getObjectByName("Sketchfab_model") ||
            loadedScene.children[0];

          if (sketchfabRoot) {
            console.log(
              "Original Sketchfab position:",
              sketchfabRoot.position
            );

            /*
              Remove the huge position:
              approximately 6.22, -1.79, -545.40
            */
            sketchfabRoot.position.set(0, 0, 0);
            sketchfabRoot.updateMatrixWorld(true);

            console.log(
              "Sketchfab offset successfully removed."
            );
          } else {
            console.warn(
              "Sketchfab root was not found."
            );
          }

          /*
            Prevent incorrect culling after changing the model's
            internal position.
          */
          loadedScene.traverse((object) => {
            if (object.isMesh) {
              object.frustumCulled = false;
              object.visible = true;

              if (object.material) {
                const materials = Array.isArray(object.material)
                  ? object.material
                  : [object.material];

                materials.forEach((material) => {
                  material.side = THREE.DoubleSide;
                  material.needsUpdate = true;
                });
              }
            }
          });

          loadedScene.updateMatrixWorld(true);

          this.el.emit("heart-ready");
        });
      }
    });
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    a-scene,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      width: min(84%, 420px);
      padding: 11px 15px;

      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">
    Loading animated heart…
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="180000">

      <a-asset-item
        id="heartAsset"
        src="./heart.gltf"
      ></a-asset-item>

    </a-assets>

    <!-- AR camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Strong lighting so the model cannot appear black -->
    <a-entity
      light="
        type: ambient;
        intensity: 3;
      "
    ></a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 2;
      "
      position="1 2 3"
    ></a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 1.5;
      "
      position="-2 1 2"
    ></a-entity>

    <!-- Image target -->
    <a-entity
      id="heartTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Animated heart -->
      <a-gltf-model
        id="heartModel"
        src="#heartAsset"

  position="-1 0 2"
  rotation="90 0 0"
        scale="0.01 0.01 0.01"

        fix-heart-model

        animation-mixer="
          clip: Scene;
          loop: repeat;
          repetitions: Infinity;
          timeScale: 1;
          clampWhenFinished: false;
        "
      ></a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const status =
        document.getElementById("status");

      const scene =
        document.querySelector("a-scene");

      const target =
        document.getElementById("heartTarget");

      const model =
        document.getElementById("heartModel");

      let heartReady = false;

      scene.addEventListener("arReady", () => {
        status.textContent =
          "Camera ready. The heart is still loading…";
      });

      scene.addEventListener("arError", () => {
        status.textContent =
          "AR could not start. Check camera permission and HTTPS.";

        status.style.background =
          "rgba(160, 0, 0, 0.9)";
      });

      model.addEventListener("model-loaded", () => {
        status.textContent =
          "Heart downloaded. Correcting its position…";

        const loadedScene =
          model.getObject3D("mesh");

        if (loadedScene?.animations) {
          console.log(
            "Animation clips:",
            loadedScene.animations.map(
              animation => animation.name
            )
          );
        }
      });

      model.addEventListener("heart-ready", () => {
        heartReady = true;

        status.textContent =
          "Heart ready. Point the camera at the complete target.";

        status.style.background =
          "rgba(0, 105, 50, 0.88)";

        console.log(
          "The heart is loaded, centred and ready."
        );
      });

      model.addEventListener("model-error", (event) => {
        console.error(
          "GLTF loading error:",
          event.detail
        );

        status.textContent =
          "MODEL ERROR — check the GLTF, BIN and image files.";

        status.style.background =
          "rgba(160, 0, 0, 0.9)";
      });

      target.addEventListener("targetFound", () => {
        status.textContent = heartReady
          ? "Target detected — animated heart displayed."
          : "Target detected, but the heart is still loading.";
      });

      target.addEventListener("targetLost", () => {
        status.textContent = heartReady
          ? "Heart ready. Point the camera at the target again."
          : "The heart is still loading…";
      });
    });
  </script>

</body>
</html>
