<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>MindAR Red Box Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    a-scene,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      width: min(82%, 420px);
      padding: 11px 15px;

      color: white;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">Starting camera…</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="testTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-box
        position="0 0 0.2"
        rotation="0 45 0"
        scale="100 100 100"
        color="#ff0000"
        material="
          color: #ff0000;
          opacity: 1;
          transparent: false;
        "
      ></a-box>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const status = document.getElementById("status");
      const scene = document.querySelector("a-scene");
      const target = document.getElementById("testTarget");

      scene.addEventListener("arReady", () => {
        status.textContent =
          "Camera ready. Point it at the full target image.";
      });

      scene.addEventListener("arError", () => {
        status.textContent =
          "AR failed to start. Check camera permission and HTTPS.";
      });

      target.addEventListener("targetFound", () => {
        status.textContent =
          "Target detected. The red box should now be visible.";
      });

      target.addEventListener("targetLost", () => {
        status.textContent =
          "Target lost. Point the camera at the full image again.";
      });
    });
  </script>

</body>
</html>
